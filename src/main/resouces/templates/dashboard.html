<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dashboard</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-gradient-to-br from-indigo-50 to-white">
<nav class="bg-white shadow p-4 flex justify-between"><div class="font-bold text-indigo-700">My Bank</div><div><a href="/logout" class="text-red-500">Logout</a></div></nav>
<div class="container mx-auto p-6"><div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<div class="col-span-2"><div class="bg-white rounded-2xl shadow p-6"><h3 class="text-xl font-semibold text-indigo-700">Accounts</h3>
<table class="w-full mt-4"><thead><tr><th>Account No</th><th>Type</th><th>Balance</th><th>Actions</th></tr></thead><tbody>
<tr th:each="acc : ${user.accounts}"><td th:text="${acc.accountNumber}"></td><td th:text="${acc.type}"></td><td th:text="${acc.balance}"></td>
<td><form method="post" action="/deposit" class="inline-block"><input type="hidden" name="accNum" th:value="${acc.accountNumber}"/><input name="amount" placeholder="Enter deposit amount:" required class="p-1 rounded border"/><button class="ml-1 bg-green-500 text-white px-2 rounded">Deposit</button></form>
<form method="post" action="/withdraw" class="inline-block ml-2"><input type="hidden" name="accNum" th:value="${acc.accountNumber}"/><input name="amount" placeholder="Enter withdrawal amount:" required class="p-1 rounded border"/><button class="ml-1 bg-yellow-500 text-white px-2 rounded">Withdraw</button></form></td></tr>
</tbody></table>
<div class="mt-6"><h4 class="font-semibold">Create new account</h4><form method="post" action="/createAccount" class="flex gap-2 mt-2"><input name="accNum" placeholder="Enter account number:" required class="p-2 rounded border"/><select name="type" class="p-2 rounded border"><option>Savings</option><option>Checking</option></select><button class="bg-indigo-600 text-white px-4 rounded">Create</button></form></div>
<div class="mt-6"><h4 class="font-semibold">Transfer funds</h4><form method="post" action="/transfer" class="flex gap-2 mt-2"><input name="fromAcc" placeholder="Enter from account number:" required class="p-2 rounded border"/><input name="toAcc" placeholder="Enter to account number:" required class="p-2 rounded border"/><input name="amount" placeholder="Enter amount to transfer:" required class="p-2 rounded border"/><button class="bg-indigo-600 text-white px-4 rounded">Transfer</button></form></div>
</div></div>
<div><div class="bg-white rounded-2xl shadow p-6"><h3 class="text-xl font-semibold text-indigo-700">Summary</h3><p class="mt-3">User: <span th:text="${user.username}"></span></p><p>Total Balance: <span th:text="${user.totalBalance}"></span></p>
<div class="mt-4"><h4 class="font-semibold">Recent Transactions</h4><ul class="mt-2"><li th:each="acc : ${user.accounts}"><div><strong th:text="${acc.accountNumber}"></strong><ul><li th:each="t : ${acc.transactions}" th:text="${t}"></li></ul></div></li></ul></div></div></div>
</div><div th:if="${error}" class="text-red-600 mt-4" th:text="${error}"></div></div></body></html>
