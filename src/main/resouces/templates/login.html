<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Login</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50 flex items-center justify-center">
<div class="w-full max-w-md"><div class="bg-white shadow-2xl rounded-2xl p-8">
<h2 class="text-2xl font-bold text-indigo-700 mb-4">Online Banking Login</h2>
<form method="post" action="/login" class="space-y-4">
  <div><label class="block text-sm font-medium">Enter username:</label><input name="username" required placeholder="Enter username" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-2" /></div>
  <div><label class="block text-sm font-medium">Enter password:</label><input type="password" name="password" required placeholder="Enter password" class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-2" /></div>
  <div><button class="w-full bg-indigo-600 text-white py-2 rounded-md">Login</button></div>
  <div class="text-center"><a href="/register" class="text-indigo-500">Register</a></div>
  <div th:if="${error}" class="text-red-600 mt-2" th:text="${error}"></div>
  <div th:if="${msg}" class="text-green-600 mt-2" th:text="${msg}"></div>
</form></div></div></body></html>
